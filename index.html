 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Temperature Converter</h2>

        <input type="number" id="inputValue" placeholder="Enter temperature">

        <select id="type">
            <option value="celsius">Celsius to Fahrenheit</option>
            <option value="fahrenheit">Fahrenheit to Celsius</option>
            <option value="kelvin">Celsius to Kelvin</option>
        </select>

        <button onclick="convert()">Convert</button>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
